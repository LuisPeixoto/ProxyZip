[package]
name = "proxyzip-codec"
description = "Body decoding (gzip/deflate/br/zstd) and content classification for ProxyZip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
proxyzip-core.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
zstd.workspace = true
graphql-parser = "0.4"
jaq-core = "3"
jaq-json = "2"
jaq-std = { version = "3", features = ["format", "math", "regex"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
rmpv = "1"

[dev-dependencies]
prost-types = "0.14"
