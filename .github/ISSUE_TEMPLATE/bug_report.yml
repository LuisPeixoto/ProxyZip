name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the
        [troubleshooting guide](https://github.com/LuisPeixoto/ProxyZip/blob/main/docs/troubleshooting.md) first.
        **Remove secrets** (tokens, cookies, passwords) from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ProxyZip
        2. Run `curl ...`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Command line
        - Proxy engine / HTTPS interception
        - Certificate installation
        - System proxy
        - Import / export
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProxyZip version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.1 / Windows 11 23H2 / Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `PROXYZIP_LOG=debug` and paste the relevant lines.
      render: shell
