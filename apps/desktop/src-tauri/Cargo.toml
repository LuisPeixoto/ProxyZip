[package]
name = "proxyzip-desktop"
description = "ProxyZip desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "proxyzip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "proxyzip-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
parking_lot.workspace = true
proxyzip-certinstall.workspace = true
proxyzip-codec.workspace = true
proxyzip-core.workspace = true
proxyzip-export.workspace = true
proxyzip-proxy.workspace = true
proxyzip-rules.workspace = true
proxyzip-sysproxy.workspace = true
proxyzip-tls.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
